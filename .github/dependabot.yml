version: 2
updates:
  # This library's only dependencies are its action pins, and every `uses:` here is
  # a full commit SHA with a trailing `# vN` — the exact shape Dependabot needs to
  # map a pin to a version.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
