name: policies

on:
  workflow_call:

permissions:
  contents: read

jobs:
  branch:
    name: branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.ref_type == 'branch' }}
    steps:
      - name: Validate branch name
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "Validating branch: ${BRANCH_NAME}"

          if [[ "${BRANCH_NAME}" == "main" ]]; then
            echo "main is a valid protected branch."
            exit 0
          fi

          if [[ "${BRANCH_NAME}" =~ ^dependabot/ ]]; then
            echo "Valid Dependabot branch."
            exit 0
          fi

          if [[ "${BRANCH_NAME}" =~ ^(feature|fix|docs|ci|infra|security|governance|deps|content)/[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "Valid ${BASH_REMATCH[1]} branch."
            exit 0
          fi

          echo "::error::Invalid branch name: ${BRANCH_NAME}"
          echo ""
          echo "Allowed branch formats:"
          echo "  main"
          echo "  dependabot/<ecosystem>/<dir>/<pkg>-<hash>"
          echo "  feature/<name>"
          echo "  fix/<name>"
          echo "  docs/<name>"
          echo "  ci/<name>"
          echo "  infra/<name>"
          echo "  security/<name>"
          echo "  governance/<name>"
          echo "  deps/<name>"
          echo "  content/<name>"
          exit 1
