name: "checks/docker"

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            changed:
              - '**/Dockerfile*'
              - '**/Containerfile*'
              - '**/docker-compose.y*ml'
              - '**/compose.y*ml'

  hadolint:
    name: hadolint
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install hadolint
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --version
      - name: Lint Dockerfiles
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f \
            \( -iname 'Dockerfile*' -o -iname 'Containerfile*' \) ! -iname '*.dockerignore' -print0 2>/dev/null \
            | xargs -0 -r hadolint --failure-threshold warning
      - name: Validate compose files
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f \
            \( -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \
            -o -name 'compose.yml' -o -name 'compose.yaml' \) \
            -exec docker compose -f {} config -q \;
