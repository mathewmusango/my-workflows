name: "checks/docker"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        shell: bash
        run: |
          base="${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}"
          if ! git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only --diff-filter=ACM "$base" "$GITHUB_SHA" | grep -qiE '(^|/)Dockerfile(\.[^/]+)?$|(^|/)docker-compose\.ya?ml$|(^|/)compose\.ya?ml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  hadolint:
    name: hadolint
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install hadolint
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --version
      - name: Lint Dockerfiles
        run: |
          find . -path './.git' -prune -o -type f -iname 'Dockerfile*' -print0 2>/dev/null \
            | xargs -0 -r hadolint --failure-threshold warning
      - name: Validate compose files
        run: |
          find . -path './.git' -prune -o -type f \
            \( -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \
            -o -name 'compose.yml' -o -name 'compose.yaml' \) \
            -exec docker compose -f {} config -q \;
