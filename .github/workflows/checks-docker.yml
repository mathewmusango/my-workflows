name: "checks/docker"

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed:
              - '**/Dockerfile*'
              - '**/Containerfile*'
              - '**/*compose*.y*ml'

  hadolint:
    name: hadolint
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install hadolint
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --version
      - name: Lint Dockerfiles
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f \
            \( -iname 'Dockerfile*' -o -iname 'Containerfile*' \) ! -iname '*.dockerignore' -print0 2>/dev/null \
            | xargs -0 -r hadolint --failure-threshold warning
      - name: Validate compose files
        run: |
          set -euo pipefail
          shopt -s nullglob
          find . -path './.git' -prune -o -type f -name '*compose*.y*ml' -print0 2>/dev/null \
            | xargs -0 -r -n1 dirname | sort -u | while IFS= read -r dir; do
                [ -d "$dir" ] || continue
                base=""
                for candidate in "$dir"/compose.yml "$dir"/compose.yaml \
                                 "$dir"/docker-compose.yml "$dir"/docker-compose.yaml; do
                  if [ -f "$candidate" ]; then base="$candidate"; break; fi
                done
                if [ -z "$base" ]; then
                  for single in "$dir"/*compose*.y*ml; do
                    echo "validating $single"
                    docker compose -f "$single" config -q
                  done
                  continue
                fi
                files=(-f "$base")
                for override in "$dir"/*compose*.y*ml; do
                  [ "$override" = "$base" ] && continue
                  files+=(-f "$override")
                done
                echo "validating $dir: ${files[*]}"
                docker compose "${files[@]}" config -q
              done
