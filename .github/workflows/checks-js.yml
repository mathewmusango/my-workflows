name: "checks/js"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only --diff-filter=ACM "$BASE" "$GITHUB_SHA" | grep -qE '\.js$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  syntax:
    name: syntax
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: node --check (syntax)
        run: |
          find . -path './.git' -prune -o -type f -name '*.js' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            node --check "$f"
            echo "ok: $f"
          done
