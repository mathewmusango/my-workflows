name: "checks/jsonc"

on:
  workflow_call:
    inputs:
      script:
        description: JSONC parser to run, relative to the caller's checkout
        required: false
        type: string
        default: scripts/checks/jsonc.py
      design-root:
        description: Directory whose children must each ship config.jsonc + screenshot.png
        required: false
        type: string
        default: fastfetch

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        shell: bash
        run: |
          base="${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}"
          if ! git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only --diff-filter=ACM "$base" "$GITHUB_SHA" | grep -qE '\.jsonc$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only --diff-filter=ACM "$base" "$GITHUB_SHA" | grep -qxF '${{ inputs.script }}'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  jsonc:
    name: jsonc
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse config.jsonc files
        run: |
          set -e
          if [ ! -f "${{ inputs.script }}" ]; then
            echo "::error::${{ inputs.script }} is missing: checks-jsonc runs the caller's parser"
            exit 1
          fi
          python3 "${{ inputs.script }}"
      - name: Design folders ship config.jsonc + screenshot.png
        env:
          DESIGN_ROOT: ${{ inputs.design-root }}
        run: |
          set -e
          if [ -n "$DESIGN_ROOT" ] && ls "$DESIGN_ROOT"/*/ >/dev/null 2>&1; then
            for d in "$DESIGN_ROOT"/*/; do
              if [ ! -f "$d/config.jsonc" ] || [ ! -f "$d/screenshot.png" ]; then
                echo "incomplete design: $d"
                exit 1
              fi
            done
            echo "all designs complete"
          else
            echo "no $DESIGN_ROOT designs — skipping"
          fi
