name: "checks/jsonc"

on:
  workflow_call:
    inputs:
      script:
        description: JSONC parser to run, relative to the caller's checkout
        required: false
        type: string
        default: scripts/checks/jsonc.py
      design-root:
        description: Directory whose children must each ship config.jsonc + screenshot.png
        required: false
        type: string
        default: fastfetch

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed:
              - '**/*.jsonc'
              - '${{ inputs.script }}'

  jsonc:
    name: jsonc
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse config.jsonc files
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::$SCRIPT is missing: checks-jsonc runs the caller's parser"
            exit 1
          fi
          python3 "$SCRIPT"
      - name: Design folders ship config.jsonc + screenshot.png
        env:
          DESIGN_ROOT: ${{ inputs.design-root }}
        run: |
          set -euo pipefail
          if [ -n "$DESIGN_ROOT" ] && ls "$DESIGN_ROOT"/*/ >/dev/null 2>&1; then
            for d in "$DESIGN_ROOT"/*/; do
              if [ ! -f "$d/config.jsonc" ] || [ ! -f "$d/screenshot.png" ]; then
                echo "incomplete design: $d"
                exit 1
              fi
            done
            echo "all designs complete"
          else
            echo "no $DESIGN_ROOT designs — skipping"
          fi
