name: "checks/markdown"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        shell: bash
        run: |
          base="${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}"
          if ! git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only --diff-filter=ACM "$base" "$GITHUB_SHA" | grep -qE '\.md$|\.markdown$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  markdownlint:
    name: markdownlint
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Write centralized ruleset
        run: |
          cat > .markdownlint-cli2.central.jsonc <<'EOF'
          {
            "config": {
              "default": true,
              "MD013": false,
              "MD033": false,
              "MD041": false,
              "MD024": { "siblings_only": true }
            }
          }
          EOF
      - name: Lint Markdown
        run: |
          npx --yes markdownlint-cli2 \
            --config .markdownlint-cli2.central.jsonc \
            "**/*.md" "#**/node_modules" "#.git" "#**/site" "#**/.venv" "#**/CHANGELOG.md"
