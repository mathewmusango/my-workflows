name: "checks/python"

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            changed:
              - '**/*.py'
              - '**/pyproject.toml'
              - '**/ruff.toml'
              - '**/.ruff.toml'

  ruff:
    name: ruff
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint Python (correctness rules, blocking)
        run: pipx run "ruff==0.17.5" check .
