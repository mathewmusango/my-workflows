name: "checks/terraform"

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            changed:
              - '**/*.tf'
              - '**/*.tfvars'
              - '**/*.hcl'

  fmt:
    name: fmt
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  validate:
    name: validate
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: tfproviders-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            tfproviders-${{ runner.os }}-
      - name: Enable the Terraform plugin cache
        run: echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - name: terraform init + validate (per module)
        run: |
          set -euo pipefail
          dirs="$(find . -path './.git' -prune -o -type f -name '*.tf' -print0 2>/dev/null | xargs -0 -r -n1 dirname | sort -u)"
          if [ -z "$dirs" ]; then
            echo "no terraform modules found — skipping"
            exit 0
          fi
          while IFS= read -r d; do
            echo "::group::terraform validate $d"
            (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
            echo "::endgroup::"
          done <<< "$dirs"

  lint:
    name: lint
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: latest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}
          restore-keys: |
            tflint-${{ runner.os }}-
      - name: TFLint — init plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: TFLint
        run: tflint --recursive --format compact
