name: "checks/yaml"

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            changed:
              - '**/*.yml'
              - '**/*.yaml'

  syntax:
    name: syntax
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse YAML (Ruby's built-in psych — no installs)
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f \( -name '*.yml' -o -name '*.yaml' \) -print 2>/dev/null | while IFS= read -r f; do
            ruby -ryaml -e "YAML.load_file(ARGV[0])" "$f"
            echo "ok: $f"
          done

  actionlint:
    name: actionlint
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
