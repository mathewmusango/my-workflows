name: checks

# Group aggregator — generated by scripts/publish_workflows.sh.
# Callable only; `./` means "same commit as the caller".
on:
  workflow_call:

permissions:
  contents: read

jobs:
  jsonc:
    uses: ./.github/workflows/checks-jsonc.yml
  js:
    uses: ./.github/workflows/checks-js.yml
  shell:
    uses: ./.github/workflows/checks-shell.yml
  yaml:
    uses: ./.github/workflows/checks-yaml.yml
  python:
    uses: ./.github/workflows/checks-python.yml
  terraform:
    uses: ./.github/workflows/checks-terraform.yml
  secrets:
    uses: ./.github/workflows/security-secrets.yml
