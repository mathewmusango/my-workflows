name: "security/gitguardian"

on:
  workflow_call:
    secrets:
      GITGUARDIAN_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  gitguardian:
    name: gitguardian
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: GitGuardian/ggshield-action@7f66d3be9c59a821dcf4f45ee5d929203a1a0b90 # v1.55.0
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
