name: "security/npm-audit"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        shell: bash
        run: |
          base="${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}"
          if ! git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only --diff-filter=ACM "$base" "$GITHUB_SHA" \
            | grep -qE '(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  audit:
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Audit
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "no package-lock.json; nothing to audit"
            exit 0
          fi
          npm audit --package-lock-only --audit-level=high
