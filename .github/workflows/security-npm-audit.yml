name: "security/npm-audit"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t locks < <(find . -name package-lock.json \
            -not -path '*/node_modules/*' -not -path './.git/*' | sort)
          if [ "${#locks[@]}" -eq 0 ]; then
            echo "no package-lock.json; nothing to audit"
            exit 0
          fi
          for lock in "${locks[@]}"; do
            echo "auditing ${lock}"
            (cd "$(dirname "${lock}")" && npm audit --package-lock-only --audit-level=high)
          done
