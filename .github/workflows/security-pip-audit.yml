name: "security/pip-audit"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        shell: bash
        run: |
          base="${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}"
          if ! git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only --diff-filter=ACM "$base" "$GITHUB_SHA" \
            | grep -qE '(^|/)(requirements[^/]*\.txt|pyproject\.toml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  audit:
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Audit
        shell: bash
        run: |
          shopt -s nullglob
          files=(requirements*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no requirements*.txt; nothing to audit"
            exit 0
          fi
          pip install --disable-pip-version-check "pip-audit==2.10.1"
          for f in "${files[@]}"; do
            echo "auditing $f"
            pip-audit -r "$f"
          done
