name: "security/pip-audit"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name 'requirements*.txt' \
            -not -path '*/node_modules/*' -not -path './.git/*' \
            -not -path '*/.venv/*' -not -path '*/venv/*' \
            -not -path '*/site-packages/*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::no requirements*.txt; nothing to audit"
            exit 0
          fi
          pip install --disable-pip-version-check "pip-audit==2.10.1"
          for f in "${files[@]}"; do
            echo "auditing ${f}"
            pip-audit -r "${f}"
          done
