name: "security/pip-audit"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Audit
        shell: bash
        run: |
          shopt -s nullglob
          files=(requirements*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no requirements*.txt; nothing to audit"
            exit 0
          fi
          pip install --disable-pip-version-check "pip-audit==2.10.1"
          for f in "${files[@]}"; do
            echo "auditing $f"
            pip-audit -r "$f"
          done
