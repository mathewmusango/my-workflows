name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secrets:
    uses: ./.github/workflows/security-secrets.yml

  deps:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/security-deps.yml
