# Centralized secret scanning for every repo in the umbrella.
#
# Unlike the `checks/*` workflows this has no `detect` gate: a secret can land
# in any file, so it runs on every call. Adopt it as a required check on `main`
# and on PRs.

name: "security/secrets"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan for secrets (full history + verified findings)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
