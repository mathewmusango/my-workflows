name: "security/terraform"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12
        with:
          framework: terraform
          quiet: true
          soft_fail: true
