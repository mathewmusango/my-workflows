name: "security/terraform"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12
        with:
          framework: terraform
          quiet: true
          soft_fail: true
