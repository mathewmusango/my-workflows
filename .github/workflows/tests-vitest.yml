name: "tests/vitest"

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding package.json and the lockfile
        required: false
        type: string
        default: web
      node-version:
        description: Node major version
        required: false
        type: string
        default: "22"
      typecheck:
        description: Run `npm run typecheck` before the tests
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  vitest:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the working directory
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::error::${{ inputs.working-directory }} has no package.json"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: ${{ inputs.typecheck }}
        run: npm run typecheck
      - run: npm test
